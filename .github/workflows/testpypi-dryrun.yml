# Build-and-validate dry-run for release candidates.
#
# Runs on pull requests and on manual dispatch. It builds the sdist and wheel,
# validates them with `twine check`, and uploads the built distribution as a
# workflow artifact. It deliberately does NOT publish anywhere: the actual
# TestPyPI upload is done locally with a maintainer token (see the "release" /
# TestPyPI notes in the repository), so no PyPI/TestPyPI credentials or trusted
# publishing are needed here. This keeps the real-PyPI publish path (in
# publish-to-pypi.yml) structurally unreachable from a dry-run.

name: TestPyPI dry-run

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-check:
    name: Build and validate distribution
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10.x"

    - name: Install build tooling
      run: python3 -m pip install --upgrade build twine

    - name: Build a binary wheel and a source tarball
      run: python3 -m build

    - name: Validate distribution metadata
      run: python3 -m twine check dist/*

    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ github.sha }}
        path: dist/
